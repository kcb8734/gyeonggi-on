<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="canonical" href="https://www.kdanji.com/" />
    <title>온앤온+</title>
    <script>
      if (location.hostname === 'kdanji.com') {
        location.replace('https://www.kdanji.com' + location.pathname + location.search + location.hash);
      }
    </script>
    <script>
      (function () {
        if (document.documentElement.dataset.onandonImeGuard === '1') return;
        document.documentElement.dataset.onandonImeGuard = '1';
        document.documentElement.lang = 'ko';
        var composing = typeof WeakSet === 'function' ? new WeakSet() : null;
        if (!composing) return;
        function lock(e) {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) composing.add(e.target);
        }
        function unlock(e) {
          if (!e.target) return;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { composing.delete(e.target); });
          });
        }
        document.addEventListener('compositionstart', lock, true);
        document.addEventListener('compositionupdate', lock, true);
        document.addEventListener('compositionend', unlock, true);
        function patch(proto) {
          var desc = Object.getOwnPropertyDescriptor(proto, 'value');
          if (!desc || !desc.get || !desc.set) return;
          Object.defineProperty(proto, 'value', {
            configurable: true,
            enumerable: desc.enumerable,
            get: function () { return desc.get.call(this); },
            set: function (next) {
              if (composing.has(this)) return;
              desc.set.call(this, next);
            }
          });
        }
        patch(HTMLInputElement.prototype);
        patch(HTMLTextAreaElement.prototype);
      })();
    </script>
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; }
      #root { display: flex; height: 100%; flex: 1; }
      .app-container {
        width: 100%;
        max-width: 100vw;
        min-height: 100vh;
        margin: 0 auto;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <p style="font-family:sans-serif;padding:24px;color:#374151;font-size:14px;">
        온앤온+를 불러오는 중입니다. 연결이 안 되면
        <a href="https://www.kdanji.com" style="color:#111827;font-weight:700;">www.kdanji.com</a>
        으로 열어 주세요.
      </p>
    </div>
  </body>
</html>
