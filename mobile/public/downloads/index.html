<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>온앤온+ AAB — Play 업로드 키 필요</title>
  <style>
    body { margin: 0; background: #F7F8FA; color: #111827; font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    main { max-width: 640px; margin: 48px auto; padding: 0 18px; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { color: #4B5563; line-height: 1.6; }
    code { font-size: 13px; background: #EEF2FF; padding: 1px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Play에 올릴 AAB를 잠시 내려 두었습니다</h1>
    <p>
      이전에 올려 둔 1.0.6 AAB는 Play 업로드 키가 아닙니다.
      서명이 <code>FA:79:5A:BC:…</code> 이라서 콘솔이 거부합니다.
      Play가 요구하는 지문은 <code>E4:CA:DA:50:1D:6C:94:5B:9D:11:FA:9A:B5:79:DF:26:22:AB:11:9F</code> 입니다.
    </p>
    <p>
      <code>upload-keystore.jks</code> 원본이 이 서버에 없어 올바른 키로 다시 서명할 수 없습니다.
      그 파일을 채팅에 올리면 다시 서명해서 이 페이지에 올리겠습니다.
    </p>
  </main>
</body>
</html>
